<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="WareTrack 3D — a 3D logistics control tower: an isometric city of warehouses with live trucks, forklifts and pallets." />
    <title>WareTrack — 3D Logistics Control Tower</title>

    <!-- PWA / mobile web app -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#2f5bea" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WareTrack" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />

    <!-- fonts: Inter for the app shell, Poppins for the tutorial/onboarding UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // Register the service worker (app shell caching + offline fallback).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {})
        })
      }
    </script>
  </body>
</html>
